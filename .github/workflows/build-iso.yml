name: PrismOS-ISO bauen

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths:
      - "iso/**"
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Als GitHub-Release veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          sudo mkdir -p /mnt/prismos/work /mnt/prismos/out
          df -h / /mnt

      - name: ISO im Arch-Linux-Container bauen
        env:
          PRISMOS_SIGNING_KEY: ${{ secrets.PRISMOS_SIGNING_KEY }}
        run: |
          version="$(date +%Y.%m.%d)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF#refs/tags/v}"; fi
          set -o pipefail
          sudo docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v /mnt/prismos/work:/work \
            -v /mnt/prismos/out:/out \
            -e WORK_DIR=/work/build \
            -e PRISMOS_VERSION="$version" \
            -e PRISMOS_SIGNING_KEY \
            -e PRISMOS_REPO_ENABLED="${{ github.ref == 'refs/heads/main' && '1' || '' }}" \
            archlinux:latest \
            bash /src/scripts/build-iso.sh /out 2>&1 | sudo tee /mnt/prismos/build.log

      - name: Ergebnis anzeigen
        run: |
          ls -lh /mnt/prismos/out
          cat /mnt/prismos/out/*.sha256
          echo "== Warnungen und Hinweise aus dem Build =="
          grep -aE -i "(^|[^a-z])(warning|error|fehler|hinweis|failed)[: ]" /mnt/prismos/build.log \
            | sed -E 's/^[0-9T:.Z-]+ //' | sort | uniq -c | sort -rn | head -150 || true
          echo "== Fehlgeschlagene Hooks mit Kontext =="
          grep -a -B12 "command failed to execute correctly" /mnt/prismos/build.log || echo "keine"

      - name: Boot-Test in QEMU (BIOS und UEFI)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf socat imagemagick >/dev/null
          sudo chmod 666 /dev/kvm || true
          bash scripts/boot-test.sh /mnt/prismos/out/prismos-*.iso "$RUNNER_TEMP/boot-test"

      - name: Installation simulieren und installiertes System booten
        if: always()
        run: |
          sudo docker run --rm --privileged -v /dev:/dev -v /mnt/prismos:/mnt/prismos \
            -v "$GITHUB_WORKSPACE:/src:ro" archlinux:latest \
            bash /src/scripts/install-test.sh /mnt/prismos/out/prismos-*.iso /mnt/prismos/install-test
          echo "INSTALL-TEST: Installation erfolgreich"
          sudo chmod 666 /mnt/prismos/install-test/disk.img
          bash scripts/boot-test.sh --disk /mnt/prismos/install-test/disk.img "$RUNNER_TEMP/boot-test"
          sudo rm -f /mnt/prismos/install-test/disk.img

      - name: Verschlüsselte UEFI-Installation simulieren und booten (Btrfs, Snapshots, Secure Boot)
        if: always()
        run: |
          sudo docker run --rm --privileged -v /dev:/dev -v /mnt/prismos:/mnt/prismos \
            -v "$GITHUB_WORKSPACE:/src:ro" archlinux:latest \
            bash /src/scripts/install-test.sh /mnt/prismos/out/prismos-*.iso /mnt/prismos/install-test-uefi uefi
          echo "INSTALL-TEST-UEFI: Installation erfolgreich"
          sudo chmod 666 /mnt/prismos/install-test-uefi/disk.img
          bash scripts/boot-test.sh --uefi-disk /mnt/prismos/install-test-uefi/disk.img "$RUNNER_TEMP/boot-test"
          sudo rm -f /mnt/prismos/install-test-uefi/disk.img

      - name: Boot-Test-Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-screenshots
          path: |
            ${{ runner.temp }}/boot-test/*.png
            ${{ runner.temp }}/boot-test/*.log
          if-no-files-found: ignore

      - name: ISO als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prismos-iso
          path: /mnt/prismos/out/prismos-*
          compression-level: 0
          retention-days: 14

      - name: PrismOS-Paketquelle für Updates veröffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=/mnt/prismos/out/repo
          if [ ! -d "$dir" ]; then
            echo "::notice::Kein Signierschlüssel (Secret PRISMOS_SIGNING_KEY) – Paketquelle wird nicht veröffentlicht."
            exit 0
          fi
          gh release view repo -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create repo -R "$GITHUB_REPOSITORY" --latest=false --title "PrismOS-Paketquelle" \
              --notes "Signierte Pakete für Updates installierter PrismOS-Systeme. pacman lädt sie automatisch – zum Installieren bitte die ISO aus den anderen Releases nehmen."
          gh release upload repo -R "$GITHUB_REPOSITORY" --clobber "$dir"/*
          current=$(ls "$dir")
          for asset in $(gh release view repo -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            grep -qxF "$asset" <<<"$current" || gh release delete-asset repo "$asset" -R "$GITHUB_REPOSITORY" -y
          done

      - name: Für Release vorbereiten (Dateien > 2 GiB werden geteilt)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        run: |
          mkdir -p /mnt/prismos/release
          cd /mnt/prismos/out
          for f in prismos-*.iso; do
            if [ "$(stat -c %s "$f")" -gt 2000000000 ]; then
              split -b 1900M -d "$f" "/mnt/prismos/release/$f.part"
            else
              cp "$f" /mnt/prismos/release/
            fi
            cp "$f.sha256" /mnt/prismos/release/
          done
          ls -lh /mnt/prismos/release

      - name: GitHub-Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: PrismOS ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          files: /mnt/prismos/release/*
          body: |
            PrismOS – Live- und Installationsmedium (x86_64, BIOS und UEFI).

            Falls die ISO in Teile (`.part00`, `.part01`, …) aufgeteilt ist, zuerst zusammenfügen –
            der Name muss dem in der `.sha256`-Datei entsprechen:
            Linux/macOS: `cat NAME.iso.part* > NAME.iso` ·
            Windows: `copy /b NAME.iso.part00 + NAME.iso.part01 NAME.iso`.
            Prüfen mit `sha256sum -c NAME.iso.sha256`.
