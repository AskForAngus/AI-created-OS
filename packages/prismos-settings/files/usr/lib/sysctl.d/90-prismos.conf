# PrismOS: Leistung & Akkulaufzeit

# zram ist der einzige Swap: aggressiv dorthin auslagern, nicht in Blöcken lesen
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Seltener auf die Platte schreiben -> weniger Aufwachen, längerer Akku
vm.dirty_writeback_centisecs = 1500

# Kein NMI-Watchdog: spart Strom und Interrupts
kernel.nmi_watchdog = 0

# Ruhigere Konsole beim Booten
kernel.printk = 3 3 3 3
