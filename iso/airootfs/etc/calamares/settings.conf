# PrismOS – Calamares-Ablauf
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
-   id:       prism-cleanup
    module:   shellprocess
    config:   shellprocess-prism-cleanup.conf
-   id:       prism-finalize
    module:   shellprocess
    config:   shellprocess-prism-finalize.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - netinstall
  - plasmalnf
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@prism-cleanup
  - prismapps
  - services-systemd
  - grubcfg
  - bootloader
  - shellprocess@prism-finalize
  - umount
- show:
  - finished

branding: prismos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
