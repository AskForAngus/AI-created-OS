# PrismOS – Programmauswahl im Installer
# Nichts ist vorausgewählt. "flathub:<App-ID>" = Flatpak von Flathub,
# alles andere = Paket aus den Arch-Linux-Paketquellen.
# Sprachpakete (z. B. Firefox auf Deutsch) werden automatisch ergänzt.

- name: "Browser"
  description: "Zum Surfen im Internet"
  selected: false
  expanded: true
  packages:
    - name: firefox
      description: "Firefox – schnell, unabhängig und datenschutzfreundlich"
    - name: chromium
      description: "Chromium – die offene Basis von Google Chrome"
    - name: vivaldi
      description: "Vivaldi – Browser mit sehr vielen Einstellmöglichkeiten"
    - name: flathub:com.brave.Browser
      description: "Brave – mit eingebautem Werbe- und Tracking-Blocker (Flathub)"
    - name: flathub:com.google.Chrome
      description: "Google Chrome (Flathub)"
    - name: torbrowser-launcher
      description: "Tor Browser – anonym surfen"

