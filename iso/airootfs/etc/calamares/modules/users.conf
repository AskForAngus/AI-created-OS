---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - input
sudoersGroup:           wheel
sudoersConfigureWithGroup: true

setRootPassword:        true
doReusePassword:        true
doAutologin:            false

passwordRequirements:
    nonempty: true
    minLength: 1
allowWeakPasswords:     true
allowWeakPasswordsDefault: true

user:
    shell:              /bin/bash
    forbidden_names:    [ root, liveuser ]

hostname:
    location:           EtcFile
    writeHostsFile:     true
    template:           "prismos-${cpu}"
    forbidden_names:    [ localhost ]
