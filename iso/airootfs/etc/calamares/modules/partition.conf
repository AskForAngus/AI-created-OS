---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        64MiB
    label:              "EFI"
efiSystemPartition:     "/boot/efi"

# Swap liegt komprimiert im RAM (zram). Für den Ruhezustand kann man
# hier trotzdem eine Swap-Partition wählen.
userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice:      none

drawNestedPartitions:   false
alwaysShowPartitionLabels: true
allowManualPartitioning: true

defaultFileSystemType:  "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs", "f2fs"]

enableLuksAutomatedPartitioning: false
