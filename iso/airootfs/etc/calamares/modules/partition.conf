---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        64MiB
    label:              "EFI"
efiSystemPartition:     "/boot/efi"

# Swap liegt komprimiert im RAM (zram). Für den Ruhezustand kann man
# hier trotzdem eine Swap-Partition wählen.
userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice:      none

drawNestedPartitions:   false
alwaysShowPartitionLabels: true
allowManualPartitioning: true

# Btrfs: Snapshots vor jedem Update, Zurückrollen in „Prism Einstellungen“
defaultFileSystemType:  "btrfs"
availableFileSystemTypes: ["btrfs", "ext4", "xfs", "f2fs"]

# Verschlüsselung ist freiwillig (Häkchen im Installer, standardmäßig aus).
# LUKS2, damit später PIN (TPM) und USB-Stick hinzugefügt werden können.
# Auf BIOS-Rechnern blendet prism-live-setup die Option aus.
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
