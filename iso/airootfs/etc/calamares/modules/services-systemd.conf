---
units:
    - name: "NetworkManager.service"
      action: "enable"
      mandatory: true
    - name: "sddm.service"
      action: "enable"
      mandatory: true
    - name: "bluetooth.service"
      action: "enable"
    - name: "power-profiles-daemon.service"
      action: "enable"
    - name: "switcheroo-control.service"
      action: "enable"
    - name: "systemd-timesyncd.service"
      action: "enable"
    - name: "systemd-oomd.service"
      action: "enable"
    - name: "fstrim.timer"
      action: "enable"
    - name: "paccache.timer"
      action: "enable"
    - name: "reflector.timer"
      action: "enable"
    - name: "prism-flathub.service"
      action: "enable"
